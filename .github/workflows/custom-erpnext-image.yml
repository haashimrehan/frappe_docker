name: Custom / Build ERPNext Etsy Image

# Builds haashimrehan/erpnext-custom from apps.json whenever ERPNext publishes a new
# v16.x.y release or erpnext-etsy / tbci_customization gets a new commit, pushes it to Docker
# Hub and commits the new ERPNext pin to apps.json. Every build gets its own tag, e.g.
# v16.53.0-etsy-a91df2e-tbci-267c8e8, so a server can never keep running an old image under a
# reused tag.
# Deploying (switching the image tag and running `bench migrate`) stays manual.
#
# Required repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (a Docker Hub access token),
# TBCI_CUSTOMIZATION_TOKEN (fine-grained GitHub token with read-only Contents access to the
# private haashimrehan/tbci_customization repo; passed to the build as a BuildKit secret, never
# stored in the image), and for the success email MAIL_USERNAME (Gmail address),
# MAIL_PASSWORD (Gmail app password) and MAIL_TO (recipient).

on:
  schedule:
    # Every day at 06:30 UTC
    - cron: "30 6 * * *"

  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if nothing changed (the tag gets a -b<run number> suffix)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: custom-erpnext-image
  cancel-in-progress: false

env:
  IMAGE: haashimrehan/erpnext-custom

jobs:
  build:
    if: ${{ github.repository == 'haashimrehan/frappe_docker' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Find latest ERPNext v16 release
        id: version
        env:
          TBCI_TOKEN: ${{ secrets.TBCI_CUSTOMIZATION_TOKEN }}
        run: |
          tag=$(git ls-remote --tags --refs https://github.com/frappe/erpnext 'v16.*' \
            | awk -F/ '{print $3}' \
            | grep -E '^v16\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n1)
          test -n "$tag"
          echo "Latest ERPNext release: $tag"

          # The erpnext-etsy commit the build will clone, so the tag says which code is inside
          etsy_url=$(jq -r '.[] | select(.url | endswith("/erpnext-etsy")) | .url' apps.json)
          etsy_branch=$(jq -r '.[] | select(.url | endswith("/erpnext-etsy")) | .branch' apps.json)
          etsy_sha=$(git ls-remote "$etsy_url" "refs/heads/$etsy_branch" | cut -f1)
          test -n "$etsy_sha"
          echo "erpnext-etsy $etsy_branch is at $etsy_sha"

          # The private tbci_customization commit, read with the TBCI_CUSTOMIZATION_TOKEN secret
          if [ -z "$TBCI_TOKEN" ]; then
            echo "::error::Secret TBCI_CUSTOMIZATION_TOKEN is missing (read access to haashimrehan/tbci_customization)"
            exit 1
          fi
          # A pasted secret can carry a trailing newline or spaces
          raw_len=${#TBCI_TOKEN}
          TBCI_TOKEN=$(printf '%s' "$TBCI_TOKEN" | tr -d '[:space:]')
          tbci_url=$(jq -r '.[] | select(.url | endswith("/tbci_customization")) | .url' apps.json)
          tbci_branch=$(jq -r '.[] | select(.url | endswith("/tbci_customization")) | .branch' apps.json)
          # Run outside the checkout: actions/checkout sets an Authorization extraheader for github.com
          # in the repo's git config (this repo's GITHUB_TOKEN), which would override the token.
          tbci_sha=$(cd "$RUNNER_TEMP" && git -c "url.https://x-access-token:${TBCI_TOKEN}@github.com/haashimrehan/tbci_customization.insteadOf=https://github.com/haashimrehan/tbci_customization" \
            ls-remote "$tbci_url" "refs/heads/$tbci_branch" | cut -f1) || true
          if [ -z "$tbci_sha" ]; then
            # Diagnose without printing the token
            case "$TBCI_TOKEN" in github_pat_*) kind="fine-grained (github_pat_)" ;; ghp_*) kind="classic (ghp_)" ;; *) kind="unrecognised prefix" ;; esac
            api() { curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TBCI_TOKEN" -H "Accept: application/vnd.github+json" "$1"; }
            echo "::error::Can't read tbci_customization. Token: length $raw_len as stored, ${#TBCI_TOKEN} after trimming whitespace, $kind." \
              "GitHub API: /user -> $(api https://api.github.com/user)," \
              "/repos/.../tbci_customization -> $(api https://api.github.com/repos/haashimrehan/tbci_customization)," \
              "contents -> $(api https://api.github.com/repos/haashimrehan/tbci_customization/contents/README.md)" \
              "(401 = token invalid/expired; 404 = token valid but no access to the repo or no Contents permission)"
            exit 1
          fi
          echo "tbci_customization $tbci_branch is at $tbci_sha"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "etsy_sha=$etsy_sha" >> "$GITHUB_OUTPUT"
          echo "tbci_sha=$tbci_sha" >> "$GITHUB_OUTPUT"
          echo "image_tag=$tag-etsy-${etsy_sha:0:7}-tbci-${tbci_sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check whether the image already exists
        id: check
        env:
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
          FORCE: ${{ inputs.force }}
          RUN: ${{ github.run_number }}
        run: |
          if docker manifest inspect "$IMAGE:$IMAGE_TAG" > /dev/null 2>&1; then
            if [ "$FORCE" != "true" ]; then
              echo "$IMAGE:$IMAGE_TAG already exists, nothing to build"
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Never overwrite a tag a server may already run
            IMAGE_TAG="$IMAGE_TAG-b$RUN"
          fi
          echo "Building $IMAGE:$IMAGE_TAG"
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Pin ERPNext version in apps.json
        if: ${{ steps.check.outputs.build == 'true' }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          sed -i -E "s#(\"url\": \"https://github.com/frappe/erpnext\", \"branch\": \")[^\"]+#\1${TAG}#" apps.json
          grep -q "\"branch\": \"${TAG}\"" apps.json
          cat apps.json

      - name: Free disk space
        if: ${{ steps.check.outputs.build == 'true' }}
        run: |
          # Deleting these takes 1-1.5 min; current runners already have ~85 GB free, so only
          # clean up when space is actually short (the build needs roughly 15 GB).
          avail_gb=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          if [ "$avail_gb" -lt 40 ]; then
            echo "Only ${avail_gb} GB free, cleaning up"
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          fi
          df -h /

      - name: Setup Buildx
        if: ${{ steps.check.outputs.build == 'true' }}
        uses: docker/setup-buildx-action@v4

      # Cache only the slow-changing layers (OS packages, Node, wkhtmltopdf, build dependencies)
      # in the GitHub Actions cache. The app install is rebuilt on every build on purpose, and
      # exporting it to the cache would cost more time than it saves.
      - name: Warm base layer cache
        if: ${{ steps.check.outputs.build == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/custom/Containerfile
          target: build-deps
          outputs: type=cacheonly
          cache-from: type=gha,scope=erpnext-build-deps
          cache-to: type=gha,scope=erpnext-build-deps,mode=max

      - name: Build image
        if: ${{ steps.check.outputs.build == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/custom/Containerfile
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
            CACHE_BUST=${{ github.run_id }}
          secret-files: |
            apps_json=apps.json
          secrets: |
            git_token=${{ secrets.TBCI_CUSTOMIZATION_TOKEN }}
          cache-from: type=gha,scope=erpnext-build-deps
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.check.outputs.image_tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.check.outputs.image_tag }}
            com.italkrobot.erpnext-etsy.commit=${{ steps.version.outputs.etsy_sha }}
            com.italkrobot.tbci-customization.commit=${{ steps.version.outputs.tbci_sha }}

      - name: Smoke test image
        if: ${{ steps.check.outputs.build == 'true' }}
        env:
          REF: ${{ env.IMAGE }}:${{ steps.check.outputs.image_tag }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          docker run --rm -i -e TAG --entrypoint python3 "$REF" - <<'PY'
          import os
          import re
          from pathlib import Path

          apps_dir = Path("/home/frappe/frappe-bench/apps")
          apps = sorted(p.name for p in apps_dir.iterdir() if p.is_dir())
          print("apps:", ", ".join(apps))
          missing = {"frappe", "erpnext", "hrms", "etsy", "tbci_customization"} - set(apps)
          assert not missing, f"missing apps: {missing}"

          init = (apps_dir / "erpnext/erpnext/__init__.py").read_text()
          version = re.search(r'__version__ = "([^"]+)"', init).group(1)
          expected = os.environ["TAG"].removeprefix("v")
          assert version == expected, f"erpnext is {version}, expected {expected}"
          print("erpnext version:", version)

          # Every dotted patch module in our own apps' patches.txt must exist, or `bench migrate`
          # fails. Frappe's apps are skipped: they keep entries for long-deleted patches that
          # existing sites have already run.
          broken = []
          for app in ["etsy", "tbci_customization"]:
              patches = apps_dir / app / app / "patches.txt"
              if not patches.exists():
                  continue
              for line in patches.read_text().splitlines():
                  entry = line.split("#", 1)[0].strip()
                  if not entry or entry.startswith(("[", "execute:")) or entry.endswith(":"):
                      continue
                  base = apps_dir / app / Path(*entry.split("."))
                  if not (base.with_suffix(".py").exists() or (base / "__init__.py").exists()):
                      broken.append(f"{app}: {entry}")
          assert not broken, "patches.txt entries with no module:\n  " + "\n  ".join(broken)
          print("patches.txt entries all resolve")
          PY

      - name: Check the image holds no GitHub token
        if: ${{ steps.check.outputs.build == 'true' }}
        env:
          REF: ${{ env.IMAGE }}:${{ steps.check.outputs.image_tag }}
          TBCI_TOKEN: ${{ secrets.TBCI_CUSTOMIZATION_TOKEN }}
        run: |
          if docker history --no-trunc "$REF" | grep -qF "$TBCI_TOKEN"; then
            echo "::error::The token appears in the image history"
            exit 1
          fi
          if docker run --rm -e TBCI_TOKEN --entrypoint sh "$REF" -c \
            'grep -rIlF -e "$TBCI_TOKEN" /home/frappe /etc /opt 2>/dev/null | head -5 | grep .'; then
            echo "::error::The token appears in files inside the image"
            exit 1
          fi
          echo "No token found in the image"

      - name: Push image
        id: push
        if: ${{ steps.check.outputs.build == 'true' }}
        env:
          REF: ${{ env.IMAGE }}:${{ steps.check.outputs.image_tag }}
        run: |
          docker push "$REF"
          docker push "$IMAGE:latest"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$REF" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Commit apps.json
        if: ${{ steps.check.outputs.build == 'true' }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          if git diff --cached --quiet; then
            echo "apps.json already pins $TAG"
            exit 0
          fi
          git commit -m "Bump ERPNext to $TAG"
          git pull --rebase
          git push

      - name: Email build summary
        if: ${{ steps.check.outputs.build == 'true' }}
        uses: dawidd6/action-send-mail@v23
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: ERPNext image builder <${{ secrets.MAIL_USERNAME }}>
          subject: "New image built: ${{ env.IMAGE }}:${{ steps.check.outputs.image_tag }}"
          body: |
            A new ERPNext image was built, smoke-tested and pushed to Docker Hub.

            Image:   ${{ env.IMAGE }}:${{ steps.check.outputs.image_tag }}  (also tagged :latest)
            ERPNext: ${{ steps.version.outputs.tag }}
            Etsy app: https://github.com/haashimrehan/erpnext-etsy/commit/${{ steps.version.outputs.etsy_sha }}
            TBCI app: https://github.com/haashimrehan/tbci_customization/commit/${{ steps.version.outputs.tbci_sha }}
            Digest:  ${{ steps.push.outputs.digest }}

            Docker Hub:      https://hub.docker.com/r/${{ env.IMAGE }}/tags?name=${{ steps.check.outputs.image_tag }}
            ERPNext release: https://github.com/frappe/erpnext/releases/tag/${{ steps.version.outputs.tag }}
            Workflow run:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            apps.json:       ${{ github.server_url }}/${{ github.repository }}/blob/main/apps.json

            To deploy when ready:
              1. Back up:  bench --site frontend backup
              2. Set the image tag to ${{ steps.check.outputs.image_tag }} in the app / compose file
                 and redeploy (a new tag makes the server pull the new image)
              3. In the backend container: bench --site all migrate
                 (migrate also clears the cache; otherwise run: bench --site all clear-cache)
                 A newly added app must be installed once first, e.g.:
                 bench --site frontend install-app tbci_customization
